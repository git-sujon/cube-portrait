<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube Assembly Portrait</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stage" aria-label="3D cubes assembling into a portrait"></canvas>

<header class="hud">
  <h1>Cube Assembly Portrait</h1>
  <p><span id="count">0</span> cubes<br><span id="fps">–</span> fps</p>
</header>

<p class="hint" id="hint">Drag to orbit, scroll to zoom.</p>

<aside class="tune" id="tune" hidden>
  <label><span>Cube density</span><span id="vDensity"></span>
    <input type="range" id="density" min="48" max="160" step="4"></label>
  <label><span>Relief depth</span><span id="vDepth"></span>
    <input type="range" id="depth" min="0" max="5" step="0.05" value="2.2"></label>
  <label><span>Speed</span><span id="vSpeed"></span>
    <input type="range" id="speed" min="0.3" max="3" step="0.1" value="1"></label>
  <label><span>Red energy</span><span id="vGlow"></span>
    <input type="range" id="glow" min="0" max="2" step="0.05" value="1"></label>
  <label class="check"><input type="checkbox" id="cutout" checked><span>Remove background</span></label>
  <label class="check"><input type="checkbox" id="sound" checked><span>Sound (M)</span></label>
  <label class="btn file depthbtn">Add depth map<input type="file" id="depthFile" accept="image/*"></label>
</aside>

<footer class="dock">
  <label class="btn file">Use your photo<input type="file" id="file" accept="image/*"></label>
  <button class="btn primary" id="play" type="button">Assemble</button>
  <div class="scrub">
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Assembly progress">
    <output id="pct">0%</output>
  </div>
  <button class="btn" id="tuneBtn" type="button" aria-expanded="false" aria-controls="tune">Tune</button>
</footer>

<div class="drop" id="drop" hidden>Drop your portrait to rebuild the cubes</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script src="default-portrait.js"></script>

<script src="main.js"></script>
</body>
</html>
